apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: relayops
resources:
- api-deployment.yaml
- api-service.yaml
- configmap.yaml
- migrate-job.yaml
- namespace.yaml
- network-policies.yaml
- state-pvc.yaml
- worker-deployment.yaml
labels:
- pairs:
    app.kubernetes.io/name: relayops
  includeSelectors: true
images:
- name: relayops
  newName: relayops
  newTag: local

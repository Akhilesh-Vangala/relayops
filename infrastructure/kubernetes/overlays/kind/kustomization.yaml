apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: relayops
resources:
  - ../../base
  - postgres.yaml
secretGenerator:
  - name: relayops-secrets
    literals:
      - RELAY_DATABASE_URL=postgresql://relayops:kind-only-password@postgres:5432/relayops
      - RELAY_ACCESS_TOKEN=kind-only-access-token-0000000000000000
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: relayops
    newName: relayops
    newTag: kind

apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayops-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: wait-for-schema
        image: relayops
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - relayops.wait_for_database
        envFrom: &id001
        - configMapRef:
            name: relayops-config
        - secretRef:
            name: relayops-secrets
        securityContext: &id002
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: api
        image: relayops
        imagePullPolicy: IfNotPresent
        envFrom: *id001
        securityContext: *id002
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: state
          mountPath: /state
        - name: tmp
          mountPath: /tmp
        - name: shm
          mountPath: /dev/shm
        ports:
        - name: http
          containerPort: 8100
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: relayops-state
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi

<text x="52" y="149" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#aaa" font-weight="600">01 / Reconcile the sources</text>
<text x="52" y="204" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#f2f2f2" font-weight="700">100 ordered</text>
